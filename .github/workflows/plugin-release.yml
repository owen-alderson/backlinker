# Push a bare version tag that matches manifest.json (e.g. 1.0.0) to release the Obsidian plugin.
# Obsidian downloads main.js, manifest.json and styles.css from the GitHub release with that exact tag.
name: Release Obsidian plugin

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Tag matches manifest.json
        run: test "$(node -p 'require("./manifest.json").version')" = "$GITHUB_REF_NAME"
      - run: npm ci && npm test && npm run build
        working-directory: plugin
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp plugin/dist/main.js plugin/styles.css .
          gh release create "$GITHUB_REF_NAME" main.js manifest.json styles.css \
            --title "Obsidian plugin $GITHUB_REF_NAME" --notes "Backlinker for Obsidian $GITHUB_REF_NAME"
